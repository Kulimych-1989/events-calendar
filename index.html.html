<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Календарь мероприятий 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Mono&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }

:root{
  --bg:#EEF1F6;
  --surface:#FFFFFF;
  --surface-2:#F5F7FB;
  --ink:#141A2A;
  --ink-soft:#4B5468;
  --ink-faint:#8992A8;
  --line:#E1E5EE;
  --line-strong:#CDD3E1;

  --accent:#1F3A63;
  --accent-dark:#132845;
  --accent-soft:#E6EBF4;

  --green:#1D7A45;
  --green-bg:#E2F2E8;
  --amber:#AD7809;
  --amber-bg:#FAF0D8;
  --red:#B13A2C;
  --red-bg:#FAE2DD;
  --neutral:#8B93A6;
  --neutral-bg:#EAECF1;

  --radius:12px;
  --radius-sm:7px;
  --shadow: 0 1px 2px rgba(15,23,42,.05), 0 10px 24px rgba(15,23,42,.07);

  --font-body:'PT Sans','Segoe UI',Roboto,Arial,sans-serif;
  --font-mono:'PT Mono','SFMono-Regular',Consolas,monospace;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}

html{ font-size:16px; }
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{ color:var(--accent); }

.wrap{ max-width:1180px; margin:0 auto; padding:0 clamp(1rem,3vw,2rem) 4rem; }

/* ---------- top band ---------- */
.topband{
  background:linear-gradient(155deg, var(--accent-dark), var(--accent) 70%);
  color:#fff;
  padding:2.4rem clamp(1rem,3vw,2rem) 4rem;
}
.topband__inner{ max-width:1180px; margin:0 auto; }
.eyebrow{
  font-family:var(--font-mono);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:.72rem;
  color:rgba(255,255,255,.62);
  margin:0 0 .7rem;
}
.topband h1{
  font-family:var(--font-body);
  font-weight:700;
  font-size:clamp(1.7rem,3vw,2.3rem);
  margin:0 0 .6rem;
  letter-spacing:-.01em;
}
.topband__lead{
  margin:0;
  color:rgba(255,255,255,.82);
  font-size:.95rem;
  max-width:60ch;
}
.topband__meta{
  margin-top:.9rem;
  font-family:var(--font-mono);
  font-size:.75rem;
  color:rgba(255,255,255,.55);
}

/* ---------- KPI cards (overlap the band) ---------- */
.kpis{
  display:grid;
  grid-template-columns:repeat(5, 1fr);
  gap:.8rem;
  margin-top:-3.1rem;
  margin-bottom:1.6rem;
}
.kpi{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:.9rem 1rem;
  text-align:left;
  cursor:pointer;
  font:inherit;
  color:var(--ink);
  border-top:3px solid var(--line-strong);
  transition:transform .12s ease, border-color .12s ease;
}
.kpi:hover{ transform:translateY(-2px); }
.kpi:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.kpi__num{ font-family:var(--font-mono); font-size:1.5rem; font-weight:700; line-height:1; display:block; }
.kpi__label{ font-size:.78rem; color:var(--ink-soft); margin-top:.35rem; display:block; }
.kpi.is-active{ border-top-color:var(--accent); }
.kpi[data-key="green"]{ border-top-color:var(--green); }
.kpi[data-key="amber"]{ border-top-color:var(--amber); }
.kpi[data-key="red"]{ border-top-color:var(--red); }
.kpi[data-key="none"]{ border-top-color:var(--neutral); }
.kpi.is-active[data-key="green"]{ background:var(--green-bg); }
.kpi.is-active[data-key="amber"]{ background:var(--amber-bg); }
.kpi.is-active[data-key="red"]{ background:var(--red-bg); }
.kpi.is-active[data-key="none"]{ background:var(--neutral-bg); }
.kpi.is-active[data-key="all"]{ background:var(--accent-soft); }

@media (max-width:760px){
  .kpis{ grid-template-columns:repeat(2, 1fr); margin-top:-2.2rem; }
}

/* ---------- toolbar ---------- */
.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.toolbar{ padding:1rem 1.1rem; margin-bottom:1rem; display:flex; flex-direction:column; gap:.7rem; }
.search{
  width:100%;
  font:inherit; font-size:.92rem;
  padding:.6rem .8rem;
  border:1px solid var(--line-strong);
  border-radius:var(--radius-sm);
  background:var(--surface-2);
  color:var(--ink);
}
.search:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }

.chips{ display:flex; flex-wrap:wrap; gap:.45rem; }
.chip{
  font:inherit; font-size:.8rem;
  padding:.36rem .72rem;
  border-radius:999px;
  border:1px solid var(--line-strong);
  background:var(--surface-2);
  color:var(--ink-soft);
  cursor:pointer;
  display:inline-flex; align-items:center; gap:.4rem;
  transition:background .12s ease, color .12s ease, border-color .12s ease;
}
.chip:hover{ border-color:var(--ink-faint); }
.chip:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
.chip.is-active{ background:var(--accent); border-color:var(--accent); color:#fff; }
.chip__count{ font-family:var(--font-mono); opacity:.75; }

/* ---------- buttons ---------- */
.actions-row{ display:flex; flex-wrap:wrap; align-items:center; gap:.6rem; }
.btn{
  font:inherit; font-size:.83rem; font-weight:700;
  padding:.55rem .95rem;
  border-radius:var(--radius-sm);
  border:1px solid var(--line-strong);
  background:var(--surface-2);
  color:var(--ink);
  cursor:pointer;
}
.btn:hover{ border-color:var(--ink-faint); }
.btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.btn--primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn--primary:hover{ filter:brightness(1.08); border-color:var(--accent); }

/* ---------- month tabs ---------- */
.monthtabs{
  position:sticky; top:0; z-index:10;
  display:flex; gap:.4rem;
  overflow-x:auto;
  padding:.6rem;
  margin-bottom:1.1rem;
  background:var(--bg);
  border-bottom:1px solid var(--line);
}
.monthtab{
  flex:0 0 auto;
  font:inherit; font-size:.82rem; font-weight:700;
  padding:.5rem .9rem;
  border-radius:999px;
  border:1px solid var(--line-strong);
  background:var(--surface);
  color:var(--ink-soft);
  cursor:pointer;
  display:flex; align-items:center; gap:.4rem;
}
.monthtab__count{ font-family:var(--font-mono); font-weight:400; opacity:.7; }
.monthtab.is-active{ background:var(--accent); border-color:var(--accent); color:#fff; }

/* ---------- summary ---------- */
.summary{ margin-bottom:1.4rem; overflow:hidden; }
.summary__toggle{
  width:100%; display:flex; align-items:center; gap:.55rem;
  font:inherit; font-size:.9rem; font-weight:700; color:var(--green);
  background:none; border:none; padding:.9rem 1.1rem; cursor:pointer; text-align:left;
}
.summary__toggle:focus-visible{ outline:2px solid var(--green); outline-offset:-2px; }
.summary__toggle .chev{ margin-left:auto; transition:transform .15s ease; }
.summary__toggle[aria-expanded="true"] .chev{ transform:rotate(180deg); }
.summary__panel{ padding:0 1.1rem 1.1rem; }
.summary__list{ display:flex; flex-direction:column; gap:.5rem; margin-bottom:.8rem; }
.summary__row{
  display:flex; justify-content:space-between; gap:1rem;
  font-size:.86rem; padding:.5rem .7rem;
  background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm);
}
.summary__row-date{ font-family:var(--font-mono); color:var(--green); flex:0 0 auto; }
.summary__empty{ font-size:.86rem; color:var(--ink-soft); padding:.3rem 0 .6rem; }
.summary__hint2{ font-size:.8rem; color:var(--green); }

/* ---------- month section + rows ---------- */
.month-section{ margin-bottom:1.6rem; scroll-margin-top:3.6rem; }
.month-heading{ display:flex; align-items:baseline; gap:.6rem; margin-bottom:.6rem; }
.month-heading h2{ font-size:1.15rem; font-weight:700; margin:0; }
.month-heading__count{ font-family:var(--font-mono); font-size:.78rem; color:var(--ink-faint); }

.event{
  display:flex; gap:1rem;
  padding:1rem; margin-bottom:.65rem;
  background:var(--surface);
  border:1px solid var(--line);
  border-left:4px solid var(--neutral);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  transition:border-left-color .15s ease, opacity .15s ease;
}
.event[data-status="green"]{ border-left-color:var(--green); }
.event[data-status="amber"]{ border-left-color:var(--amber); }
.event[data-status="red"]{ border-left-color:var(--red); opacity:.72; }

.event__date{ flex:0 0 3.7rem; font-family:var(--font-mono); text-align:center; padding-top:.1rem; }
.event__date-day{ display:block; font-size:1rem; font-weight:700; line-height:1.1; color:var(--accent); }
.event__date-month{ display:block; font-size:.66rem; letter-spacing:.06em; color:var(--ink-faint); margin-top:.15rem; }

.event__body{ flex:1 1 auto; min-width:0; }
.event__tags{ display:flex; flex-wrap:wrap; gap:.4rem; margin-bottom:.4rem; }
.tag{
  font-family:var(--font-mono); font-size:.66rem; letter-spacing:.02em;
  padding:.18rem .5rem; border-radius:5px;
  background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line);
}
.event__title{ font-size:1.02rem; font-weight:700; margin:0 0 .3rem; line-height:1.32; }
.event__meta{ font-size:.83rem; color:var(--ink-soft); margin-bottom:.4rem; display:flex; flex-wrap:wrap; gap:.25rem .5rem; }
.event__meta .sep{ color:var(--line-strong); }

.event__desc{ font-size:.87rem; color:var(--ink-soft); margin:.3rem 0 0; max-width:72ch; }
.event__desc.is-clamped{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.event__more{
  font:inherit; font-size:.8rem; font-weight:700; color:var(--accent);
  background:none; border:none; padding:.35rem 0 0; cursor:pointer;
}
.event__link{ display:inline-flex; align-items:center; gap:.3rem; font-size:.82rem; font-weight:700; color:var(--accent); text-decoration:none; margin-top:.55rem; }
.event__link:hover{ text-decoration:underline; }

.event__note{ margin-top:.55rem; }
.event__note-input{
  width:100%; max-width:34rem; font:inherit; font-size:.82rem;
  padding:.42rem .6rem; border:1px solid var(--line-strong); border-radius:var(--radius-sm);
  background:var(--surface-2); color:var(--ink);
}
.event__note-input:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
.event__note-input::placeholder{ color:var(--ink-faint); }

.event__side{ flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; gap:.4rem; }
.status-group{ display:flex; flex-direction:column; gap:.35rem; align-items:stretch; }
.status-btn{
  width:7.6rem; height:auto;
  border-radius:999px;
  border:1.5px solid var(--line-strong); background:var(--surface);
  cursor:pointer; display:flex; align-items:center; gap:.45rem;
  padding:.32rem .7rem .32rem .55rem;
  font:inherit; font-size:.78rem; font-weight:700; color:var(--ink-soft);
  transition:transform .1s ease, border-color .15s ease, background .15s ease, color .15s ease;
}
.status-btn:hover{ transform:translateY(-1px); }
.status-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.status-btn__dot{ width:.62rem; height:.62rem; border-radius:50%; flex:0 0 auto; }
.status-btn[data-color="green"] .status-btn__dot{ background:var(--green); }
.status-btn[data-color="amber"] .status-btn__dot{ background:var(--amber); }
.status-btn[data-color="red"] .status-btn__dot{ background:var(--red); }
.status-btn.is-on{ border-width:2px; }
.status-btn.is-on[data-color="green"]{ border-color:var(--green); background:var(--green-bg); color:var(--green); }
.status-btn.is-on[data-color="amber"]{ border-color:var(--amber); background:var(--amber-bg); color:var(--amber); }
.status-btn.is-on[data-color="red"]{ border-color:var(--red); background:var(--red-bg); color:var(--red); }

.empty{ text-align:center; color:var(--ink-soft); padding:3rem 1rem; font-size:.95rem; }

.foot{ margin-top:2.5rem; padding-top:1rem; border-top:1px solid var(--line); font-size:.78rem; color:var(--ink-faint); }

@media (max-width:760px){
  .event{ flex-wrap:wrap; }
  .event__date{ flex:0 0 auto; text-align:left; }
  .event__side{ flex:1 1 100%; flex-direction:row; align-items:center; justify-content:space-between; margin-top:.4rem; }
  .status-group{ flex-direction:row; flex-wrap:wrap; width:100%; }
  .status-btn{ width:auto; flex:1 1 auto; justify-content:center; }
  .actions-row{ flex-direction:column; align-items:stretch; }
  .actions-row .btn{ width:100%; text-align:center; }
}

</style>
</head>

<div class="topband">

</div>

<div class="wrap">

  <nav class="monthtabs" id="monthTabs" aria-label="Навигация по месяцам"></nav>

    </button>
    <div class="summary__panel" id="summaryPanel" hidden>

  <div id="sections"></div>
  <p class="empty" id="emptyState" hidden>Ничего не найдено — попробуйте изменить фильтр или поиск.</p>

  <footer class="foot">
    <span id="footNote"></span>
  </footer>
</div>

      loading: 'Загружаем общие отметки…',

    const res = await fetch(blobUrl(BLOB_ID), { headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error('GET failed: ' + res.status);
    const data = await res.json();
    return (data && typeof data === 'object' && !Array.isArray(data)) ? data : {};
  }

  async function pushRemote(data){
    const res = await fetch(blobUrl(BLOB_ID), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(data),
    });
    if (!res.ok) throw new Error('PUT failed: ' + res.status);
  }

  function persist(){
    saveLocal();
    if (!BLOB_ID) return;

      pushRemote(statuses).then(() => setSyncStatus('ok')).catch(() => setSyncStatus('error'));
    }, 400);
  }

  async function loadInitialState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);

      setSyncStatus('error');

          statuses = remote;
          saveLocal();

        setSyncStatus('ok');

        setSyncStatus('error');
      }
    }, SYNC_POLL_MS);
  }

  function setStatus(id, color){

    statuses[id] = statuses[id] || {};
    statuses[id].status = next;

  }
  function setNote(id, text){
    statuses[id] = statuses[id] || {};

  }

  /* ---------------- filters ---------------- */
  function categories(){ return [...new Set(DATA.map(e => e.category))]; }

  function matchesFilters(ev){

    if (searchQuery){
      const hay = (ev.title + ' ' + ev.location + ' ' + ev.topics.join(' ') + ' ' + ev.category).toLowerCase();
      if (!hay.includes(searchQuery)) return false;

  }

  function counts(){
    const c = { all: DATA.length, green: 0, amber: 0, red: 0, none: 0 };
    DATA.forEach(ev => {
      const s = getStatus(ev.id);
      if (s === 'green') c.green++;
      else if (s === 'amber') c.amber++;
      else if (s === 'red') c.red++;
      else c.none++;
    });
    return c;
  }

  /* ---------------- rendering ---------------- */
  function renderKPIs(){
    const c = counts();
    const defs = [
      {key:'all', label:'Всего', count:c.all},
      {key:'green', label:'Пойду', count:c.green},
      {key:'amber', label:'Уточнить', count:c.amber},
      {key:'red', label:'Не пойду', count:c.red},
      {key:'none', label:'Без отметки', count:c.none},
    ];
    els.kpis.innerHTML = '';
    defs.forEach(d => {
      const btn = document.createElement('button');

      btn.addEventListener('click', () => { statusFilter = d.key; render(); });
      els.kpis.appendChild(btn);
    });
  }

  function renderCategoryChips(){
    const cats = categories();
    els.categoryChips.innerHTML = '';
    cats.forEach(cat => {
      const n = DATA.filter(e => e.category === cat).length;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chip' + (activeCategories.has(cat) ? ' is-active' : '');

      btn.innerHTML = `${cat} <span class="chip__count">${n}</span>`;

        if (activeCategories.has(cat)) activeCategories.delete(cat);
        else activeCategories.add(cat);

      });
      els.categoryChips.appendChild(btn);

  }

  function allMonthKeys(){
    const keys = [...new Set(DATA.map(e => monthKey(e.dateStart)))];
    keys.sort();
    return keys;
  }

  function renderMonthTabs(filtered){
    const keys = allMonthKeys();
    const filteredCountByMonth = {};
    filtered.forEach(e => {
      const k = monthKey(e.dateStart);
      filteredCountByMonth[k] = (filteredCountByMonth[k] || 0) + 1;
    });
    els.monthTabs.innerHTML = '';
    keys.forEach(k => {
      const [y,m] = k.split('-').map(Number);

      tab.type = 'button';

  function render(){
    const filtered = DATA.filter(matchesFilters);
    const sorted = [...filtered].sort((a,b) => a.dateStart.localeCompare(b.dateStart));

    renderKPIs();

    els.sections.innerHTML = '';

      const k = monthKey(ev.dateStart);

      byMonth.get(k).push(ev);

    [...byMonth.keys()].sort().forEach(k => {

    if (tabObserver) tabObserver.disconnect();

    tabObserver = new IntersectionObserver((entries) => {

  /* ---------------- copy / export / import ---------------- */
  function copyTextToClipboard(text, onDone, onFail){

      fallbackCopy(text, onDone, onFail);

  }
  function fallbackCopy(text, onDone, onFail){
    try{
      const ta = document.createElement('textarea');

      onDone();
    }catch(e){ onFail(); }
  }

  function copyList(){
    const green = DATA.filter(e => getStatus(e.id) === 'green').sort((a,b) => a.dateStart.localeCompare(b.dateStart));

      `${formatRange(ev.dateStart, ev.dateEnd)} — ${ev.title} (${ev.location})`
    ).join('\n');
    copyTextToClipboard(text,
      () => { els.copyHint.textContent = 'Скопировано.'; setTimeout(() => els.copyHint.textContent = '', 2500); },
      () => { els.copyHint.textContent = 'Не удалось скопировать — выделите текст вручную.'; }
    );
  }

  /* ---------------- wire up ---------------- */
  els.search.addEventListener('input', () => { searchQuery = els.search.value.trim().toLowerCase(); render(); });

  els.summaryToggle.addEventListener('click', () => {
    const expanded = els.summaryToggle.getAttribute('aria-expanded') === 'true';
    els.summaryToggle.setAttribute('aria-expanded', String(!expanded));
    els.summaryPanel.hidden = expanded;
  });

  els.copyListBtn.addEventListener('click', copyList);

  (async function init(){
    await loadInitialState();
    render();
    startBackgroundSync();
  })();
})();

</script>
</body>
</html>
